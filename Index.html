<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOGAME AI - Pro V2</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;font-family:Poppins;background:#000;overflow:hidden}

/* BACKGROUND */
.bg{
position:fixed;inset:0;z-index:-1;
background:
radial-gradient(circle at 20% 20%, #1abc9c55, transparent 40%),
radial-gradient(circle at 80% 30%, #3498db55, transparent 40%),
radial-gradient(circle at 50% 80%, #ff7e5f55, transparent 40%);
animation:bg 20s ease-in-out infinite;
}
@keyframes bg{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

.app{
max-width:540px;height:100vh;margin:auto;
background:rgba(0,0,0,.6);
backdrop-filter:blur(25px);
display:flex;flex-direction:column
}

/* HEADER */
.header{
padding:14px;display:flex;gap:10px;align-items:center;
color:#fff;border-bottom:1px solid #ffffff18
}
.header img{width:42px;height:42px;border-radius:12px}
.header h1{font-size:17px}
.header span{font-size:11px;opacity:.7}
.header button{
margin-left:auto;background:#ff4d4d;
border:none;color:#fff;border-radius:6px;
padding:4px 8px;font-weight:600;cursor:pointer
}

/* CHAT */
.chat{
flex:1;padding:16px;overflow-y:auto;
display:flex;flex-direction:column;gap:14px;
scroll-behavior:smooth
}

.msg{
max-width:90%;padding:14px 18px;
border-radius:20px;font-size:15px;
line-height:1.45;white-space:pre-wrap;position:relative
}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#ff8a00,#ff3d00);
color:#fff;border-bottom-right-radius:6px
}
.ai{
align-self:flex-start;
background:linear-gradient(135deg,#1abc9c,#3498db);
color:#fff;border-bottom-left-radius:6px
}
.pin{border:2px solid gold;box-shadow:0 0 10px gold}

/* ACTIONS (AI ONLY) */
.actions{
display:flex;gap:10px;
justify-content:flex-end;
margin-top:10px
}
.actions button{
border:none;border-radius:8px;
padding:6px 10px;
font-size:15px;cursor:pointer;
background:#ff8a00;color:#fff
}
.actions .copy{}
.actions .pinbtn{}
.actions .del{}

/* INPUT */
.input{
padding:12px;border-top:1px solid #ffffff18;
display:flex;gap:10px
}
textarea{
flex:1;resize:none;min-height:46px;
border:none;border-radius:18px;
padding:12px 16px;background:#ffffff22;
color:#fff;font-size:15px;outline:none
}
.send{
width:46px;height:46px;border:none;
border-radius:50%;background:#10a37f;
display:flex;align-items:center;justify-content:center
}
.send svg{width:22px;fill:#fff}

/* TYPING */
.typing{display:flex;gap:6px;margin-left:4px}
.typing div{
width:8px;height:8px;border-radius:50%;
background:#fff;animation:blink 1s infinite
}
.typing div:nth-child(2){animation-delay:.2s}
.typing div:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="app">
  <div class="header">
    <img src="https://i.postimg.cc/m22rtck7/IMG-20260113-WA0070.jpg">
    <div>
      <h1>NOGAME AI</h1>
      <span>Assistant Intelligent</span>
    </div>
    <button onclick="clearChat()">🗑 Supp L'historique</button>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input">
    <textarea id="q" placeholder="Écris ton message..."></textarea>
    <button class="send" onclick="ask()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("q");
let history=[], pinned=null;

// LOAD HISTORY
try{history=JSON.parse(localStorage.getItem("nogame_chat"))||[]}catch{}
pinned=localStorage.getItem("nogame_pin");

function save(){localStorage.setItem("nogame_chat",JSON.stringify(history));}

function render(){
chat.innerHTML="";
if(pinned){
  const p=document.createElement("div");
  p.className="msg ai pin";
  p.innerText="📌 "+pinned;
  chat.appendChild(p);
}

history.forEach((m,i)=>{
  const d=document.createElement("div");
  d.className="msg "+m.role;
  d.innerText=m.text;

  if(m.role==="ai" && m.showActions){
    const a=document.createElement("div");
    a.className="actions";

    const c=document.createElement("button");
    c.className="copy"; c.innerText="📋";
    c.onclick=()=>{navigator.clipboard.writeText(m.text);alert("Réponse copiée ✅")};

    const p=document.createElement("button");
    p.className="pinbtn"; p.innerText="📌";
    p.onclick=()=>{pinned=(pinned===m.text?null:m.text);localStorage.setItem("nogame_pin",pinned);render();};

    const del=document.createElement("button");
    del.className="del"; del.innerText="❌";
    del.onclick=()=>{history.splice(i,1);save();render();};

    a.append(c,p,del);
    d.appendChild(a);
  }

  chat.appendChild(d);
});
chat.scrollTop=chat.scrollHeight;
}

function clearChat(){
if(!confirm("Nouvelle conversation ?"))return;
history=[{role:"ai",text:"👋 Nouvelle conversation. Pose-moi ta question.",showActions:false}];
pinned=null;
localStorage.clear();
save();render();
}

async function ask(){
const text=input.value.trim(); if(!text)return;
history.push({role:"user",text});
save();render(); input.value="";

const aiMsg={role:"ai",text:"",showActions:false};
history.push(aiMsg);
save();render();

const d=chat.lastChild;
d.innerHTML='<div class="typing"><div></div><div></div><div></div></div>';

// ==== NEW CORS-FREE API ====
try{
const res=await fetch("https://chateverywhere.app/api/chat/",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({message:text})
});
const data=await res.json();
const reply=data.response||"Réponse indisponible";

let i=0;
d.innerHTML="";
function type(){
  if(i<reply.length){
    aiMsg.text+=reply[i++];
    d.innerText=aiMsg.text;
    setTimeout(type,25);
  }else{
    aiMsg.showActions=true;
    save();render();
  }
}
type();
}catch{
aiMsg.text="❌ Erreur serveur.";
aiMsg.showActions=true;
save();render();
}
}

if(history.length===0){
history.push({role:"ai",text:"👋 Salut, je suis NOGAME AI. Pose-moi ta question.",showActions:false});
save();
}
render();
</script>
</body>
</html>
