<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝗡𝗢𝗚𝗔𝗠𝗘 𝗔𝗜 𝗖𝗵𝗮𝘁 𝗠𝗼𝗱𝗲𝗿𝗻𝗲</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  height: 100vh;
  font-family: 'Poppins', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(270deg, #1e3c72, #2a5298, #ff7e5f, #feb47b, #1abc9c);
  background-size: 1000% 1000%;
  animation: gradientBG 20s ease infinite;
  overflow: hidden;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  width: 95%;
  max-width: 480px;
  height: 95vh;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(20px);
  border-radius: 30px;
  padding: 25px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

header {
  text-align: center;
  color: #fff;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header img {
  width: 90px;
  height: 90px;
  margin-bottom: 10px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

header h2 { font-weight: 700; font-size: 26px; text-shadow: 0 0 10px #fff; }
header p { font-size: 15px; opacity: 0.9; text-shadow: 0 0 5px #000; }

.chat {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border-radius: 25px;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  box-shadow: 0 4px 15px rgba(255,255,255,0.2);
  scroll-behavior: smooth;
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #ff8a00, #ff3d00);
  color: #fff;
  font-family: 'Roboto', sans-serif;
  font-size: 17px;
  padding: 14px 18px;
  border-radius: 25px 25px 0 25px;
  max-width: 85%;
  word-wrap: break-word;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.ai {
  align-self: flex-start;
  background: linear-gradient(135deg, #1abc9c, #3498db);
  color: #fff;
  font-family: 'Times New Roman', serif; /* Police AI an Times New Roman */
  font-size: 18px;
  padding: 16px 20px;
  border-radius: 25px 25px 25px 0;
  max-width: 85%;
  word-wrap: break-word;
  opacity: 0;
  animation: slideUp 0.5s forwards;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.input-zone {
  margin-top: 15px;
  display: flex;
  gap: 10px;
}

textarea {
  flex: 1;
  resize: none;
  height: 70px;
  border-radius: 25px;
  border: none;
  padding: 18px;
  font-family: 'Roboto', sans-serif;
  font-size: 16px;
  outline: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: 0.3s;
}

textarea::placeholder { color: rgba(255,255,255,0.7); }
textarea:focus { background: rgba(255,255,255,0.25); }

button {
  width: 65px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff8a00, #2ecc71);
  color: white;
  font-size: 26px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover { transform: scale(1.1); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

</style>
</head>

<body>
<div class="container">
  <header>
    <img src="https://i.postimg.cc/m22rtck7/IMG-20260113-WA0070.jpg" alt="Logo AI">
    <h2>🧠 𝗡𝗢𝗚𝗔𝗠𝗘 𝗔𝗜</h2>
    <p>𝑨𝒔𝒔𝒊𝒔𝒕𝒂𝒏𝒕 𝒊𝒏𝒕𝒆𝒍𝒍𝒊𝒈𝒆𝒏𝒕</p>
  </header>

  <div id="chat" class="chat">
    <div class="ai">👋 Bonjour, pose-moi ta question.</div>
  </div>

  <div class="input-zone">
    <textarea id="question" placeholder="Écris ici..."></textarea>
    <button onclick="askAI()">➤</button>
  </div>
</div>

<script>
async function askAI() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += `<div class="user">🙍🏻‍♂️ ${text}</div>`;
  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const aiDiv = document.createElement("div");
  aiDiv.className = "ai";
  aiDiv.innerText = "🤖 Réflexion...";
  chat.appendChild(aiDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const url =
      "https://corsproxy.io/?https://apis.prexzyvilla.site/ai/meta-ai?text=" +
      encodeURIComponent(text);

    const res = await fetch(url);
    const data = await res.json();

    let reply = data.reply || data.response || data.result || "Pas de réponse.";

    aiDiv.innerText = "🧠 " + reply;

  } catch (e) {
    aiDiv.innerText = "❌ Erreur de connexion";
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
